name: Собрать тестовое приложение

# Запускается ТОЛЬКО вручную: вкладка Actions → «Собрать тестовое приложение» → Run workflow.
# Сама собирает пустой проект React Native, кладёт в него наши файлы и выкладывает готовый
# APK в раздел Releases. Ничего устанавливать на компьютер не нужно.

on:
  workflow_dispatch: {}

permissions:
  contents: write # нужно, чтобы выложить готовый APK в раздел Releases

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Сверка файлов с манифестом из архива: показывает, какие файлы в репозитории
      # отличаются от выданных. Расхождения в src/config.ts и legal/operator.json сюда не
      # попадают (их вы правите сами). Не останавливает сборку — только сообщает.
      - name: 0. Проверить, что файлы загрузились целиком
        run: |
          if [ ! -f MANIFEST.sha256 ]; then
            echo "::warning::MANIFEST.sha256 нет в репозитории — загружена старая версия файлов"
          else
            sha256sum -c MANIFEST.sha256 2>&1 | grep -v ': OK$' || echo "Все файлы совпадают с выданными."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 1. Создать пустой проект React Native
        env:
          CI: "true"
        run: >
          npx --yes @react-native-community/cli@20.2.0 init CarApp
          --version 0.75.4 --skip-install --skip-git-init --pm npm
          --package-name com.carapp --directory rn

      - name: 2. Положить в него наши файлы
        run: |
          cp -r src legal scripts assets rn/
          cp App.tsx tsconfig.json babel.config.js rn/
          rm -rf rn/__tests__
          node scripts/ci.js prepare rn .

      - name: 3. Установить библиотеки
        working-directory: rn
        run: npm install --no-audit --no-fund

      - name: Кэш Gradle (ускоряет повторные сборки)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      # Именно release, а не debug: только он зашивает код приложения внутрь APK.
      # Debug-сборка на чужом телефоне показала бы красный экран (ждёт компьютер с Metro).
      # Release тут подписан стандартным отладочным ключом, поэтому ставится на любой телефон.
      - name: 4. Собрать приложение (10–20 минут)
        working-directory: rn/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a --no-daemon --stacktrace

      - name: 5. Подготовить файл
        run: cp rn/android/app/build/outputs/apk/release/app-release.apk car-app-test.apk

      - name: 6. Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Тестовая сборка №${{ github.run_number }}
          body: Тестовая сборка для проверки на телефоне. Скачайте файл car-app-test.apk и установите.
          files: car-app-test.apk
          make_latest: true

      - name: Запасной вариант — файл во вкладке Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: car-app-test
          path: car-app-test.apk
          retention-days: 30

      - name: Итог
        run: |
          {
            echo "## ✅ Готово"
            echo ""
            echo "Ссылка для скачивания на телефоне:"
            echo ""
            echo "https://github.com/${{ github.repository }}/releases/latest/download/car-app-test.apk"
            echo ""
            echo "Если репозиторий приватный — на телефоне нужно быть залогиненным в GitHub."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Что делать, если не получилось
        if: failure()
        run: |
          {
            echo "## ❌ Сборка не удалась"
            echo ""
            echo "1. Найдите выше шаг с красным крестиком и нажмите на него."
            echo "2. Пролистайте вниз и скопируйте последние 30–40 строк (или сделайте скриншот)."
            echo "3. Пришлите их — по тексту ошибки найдём причину."
          } >> "$GITHUB_STEP_SUMMARY"
